<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Un phare dans la nuit, entre rochers, brume et reflets. Une interprétation réaliste réalisée avec des formes, textures et animations CSS, sans photographie.">
    <meta name="color-scheme" content="dark">
    <title>Come back home</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <main class="artwork">
      <div class="scene" role="img" aria-label="Sous un ciel étoilé et une lune voilée, un phare de pierre à bande rouge et la maison de son gardien se dressent sur une côte rocheuse. La lanterne ambrée tourne automatiquement et balaie horizontalement la brume, au-dessus d’une mer sombre aux reflets argentés.">
        <div class="world" aria-hidden="true">
          <div class="stars"></div>
          <div class="moon"></div>
          <div class="cloud-bank cloud-bank-one"></div>
          <div class="cloud-bank cloud-bank-two"></div>
          <div class="far-shore far-shore-one"></div>
          <div class="far-shore far-shore-two"></div>
          <div class="sea"></div>
          <div class="moon-reflection"></div>
          <div class="light-reflection"></div>
          <div class="water-shimmer"></div>
          <div class="island"></div>
          <div class="keeper-house"><div class="house-roof"></div><div class="house-wall"><span></span><span></span></div></div>
          <div class="lighthouse">
            <div class="beacon">
              <div class="beam beam-haze"></div>
              <div class="beam beam-main"></div>
              <div class="beam beam-haze beam-opposite"></div>
              <div class="beam beam-main beam-opposite"></div>
            </div>
            <div class="spire"></div>
            <div class="roof"></div>
            <div class="lantern"><span class="lamp"></span></div>
            <div class="tower"><span class="window window-one"></span><span class="window window-two"></span><span class="door"></span></div>
            <div class="gallery"></div>
            <div class="foundation"></div>
          </div>
          <div class="foam foam-one"></div>
          <div class="foam foam-two"></div>
          <div class="foreground-rock foreground-rock-one"></div>
          <div class="foreground-rock foreground-rock-two"></div>
          <div class="foreground-rock foreground-rock-three"></div>
          <div class="mist mist-back"></div>
          <div class="mist mist-front"></div>
          <div class="grain"></div>
        </div>
      </div>
    </main>
    <script data-goatcounter="https://jimynoob.goatcounter.com/count"
            async src="https://gc.zgo.at/count.js"></script>
  </body>
</html>
